name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # Updated to write so the action can manage deployment artifacts
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Removed cache: npm since you do not have a package-lock.json

      - name: Install dependencies
        run: npm install  # Changed from 'npm ci' to 'npm install' which works without a lock file

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Ensure your project uses Vite. If using Create React App, change this to ./build

      - name: Deploy
        uses: actions/deploy-pages@v4
